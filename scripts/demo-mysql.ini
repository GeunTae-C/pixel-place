# 19-2 전용 새 인스턴스. 기존 서비스·시험 DB 설정과 독립된 F 데이터 경계
[mysqld]
basedir="C:/Program Files/MySQL/MySQL Server 8.4"
datadir=F:/MySQL/demo/data
innodb-data-home-dir=F:/MySQL/demo/data/
innodb-log-group-home-dir=F:/MySQL/demo/redo
innodb-undo-directory=F:/MySQL/demo/undo
tmpdir=F:/MySQL/demo/tmp
innodb-temp-data-file-path=F:/MySQL/demo/tmp/ibtmp1:12M:autoextend
innodb-temp-tablespaces-dir=F:/MySQL/demo/tmp/session
log-error=F:/MySQL/demo/logs/server.err
pid-file=F:/MySQL/demo/mysql.pid
secure-file-priv=F:/MySQL/demo/imports
port=3308
bind-address=127.0.0.1
mysqlx=OFF
lower-case-table-names=1
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
innodb-buffer-pool-size=134217728
innodb-redo-log-capacity=104857600
innodb-flush-log-at-trx-commit=1
sync-binlog=1
log-bin=F:/MySQL/demo/logs/binlog
log-bin-index=F:/MySQL/demo/logs/binlog.index
general-log=OFF
slow-query-log=OFF
max-connections=30
max-allowed-packet=67108864
